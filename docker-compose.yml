services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coolify-web-directory
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./custom_links.json:/app/custom_links.json:ro
    environment:
      - NODE_ENV=production
    restart: unless-stopped