services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coolify-web-directory
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./:/app/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
    restart: unless-stopped